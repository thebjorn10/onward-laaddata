name: Laadpaaltarieven bijwerken
on:
  schedule:
    - cron: '17 4 * * *'   # elke nacht om ±06:17 Nederlandse tijd
  workflow_dispatch: {}    # handmatig starten via de knop "Run workflow"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tarieven ophalen en omzetten
        run: node build-tariffs.mjs
      - name: Bewaren als er iets veranderd is
        run: |
          git config user.name "onward-bot"
          git config user.email "onward-bot@users.noreply.github.com"
          git add tariffs.json
          git diff --cached --quiet || git commit -m "Tarieven bijgewerkt $(date -u +%Y-%m-%d)"
          git push
